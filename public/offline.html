<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14b8a6">
  <title>オフライン | Myapp Blog</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #f8fafc;
      font-family: Karla, sans-serif;
    }

    main {
      width: min(560px, calc(100vw - 32px));
      padding: 32px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.82);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0 0 12px;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 999px;
      color: #0f172a;
      background: #f8fafc;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>オフラインです</h1>
    <p>ネットワークに接続できないため、最新のページを取得できませんでした。</p>
    <p>接続が戻ったら、もう一度トップページから開き直してください。</p>
    <a href="/">トップへ戻る</a>
  </main>
</body>

</html>
